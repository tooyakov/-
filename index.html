<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфолио • Разработка приложений</title>
    <meta
      name="description"
      content="Простой сайт-портфолио: продаю разработку мобильных и веб-приложений."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1115;
        --card: #171a21;
        --muted: #b6bccb;
        --accent: #7c5cff;
        --accent-2: #25d7ff;
        --text: #f4f6fb;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #1c1f2b, #0f1115 45%);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1100px, 92vw);
        margin: 0 auto;
      }

      header {
        padding: 28px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      nav {
        display: flex;
        gap: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .hero {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 40px;
        padding: 48px 0 64px;
        align-items: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(124, 92, 255, 0.2);
        color: #d9d3ff;
        font-size: 0.85rem;
      }

      h1 {
        font-size: clamp(2.1rem, 3vw, 3.2rem);
        margin: 18px 0 16px;
      }

      .hero p {
        color: var(--muted);
        line-height: 1.6;
      }

      .cta-row {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .button {
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        border: 1px solid transparent;
        transition: 0.2s ease;
      }

      .button.primary {
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #0f1115;
      }

      .button.ghost {
        border-color: rgba(255, 255, 255, 0.1);
        color: var(--text);
        background: transparent;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .stat {
        background: var(--card);
        padding: 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stat strong {
        font-size: 1.4rem;
      }

      section {
        padding: 36px 0;
      }

      .section-title {
        font-size: 1.4rem;
        margin-bottom: 18px;
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      .services {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .card h3 {
        margin-top: 0;
      }

      .portfolio {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .project {
        display: grid;
        gap: 12px;
      }

      .project span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .project .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(37, 215, 255, 0.12);
        color: #baf1ff;
        font-size: 0.75rem;
        width: fit-content;
      }

      .contact {
        background: linear-gradient(135deg, rgba(124, 92, 255, 0.15), rgba(37, 215, 255, 0.15));
        border-radius: 20px;
        padding: 32px;
        display: grid;
        gap: 16px;
      }

      footer {
        padding: 30px 0 40px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 720px) {
        header {
          flex-direction: column;
          gap: 12px;
        }

        nav {
          flex-wrap: wrap;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const services = [
        {
          title: "MVP за 4-6 недель",
          desc: "Быстрый запуск прототипа, чтобы проверить идею и выйти на рынок.",
        },
        {
          title: "Мобильные приложения",
          desc: "React Native и Flutter: iOS + Android с одним кодом.",
        },
        {
          title: "Web-продукты",
          desc: "Лендинги, личные кабинеты и SaaS-платформы.",
        },
        {
          title: "Поддержка и рост",
          desc: "Аналитика, улучшения UX и развитие продукта после релиза.",
        },
      ];

      const projects = [
        {
          name: "FoodFlow",
          desc: "Доставка здорового питания с подпиской и умным подбором меню.",
          tag: "Mobile + Admin",
        },
        {
          name: "CityPass",
          desc: "Цифровой абонемент для городских сервисов и событий.",
          tag: "Web + Mobile",
        },
        {
          name: "Tutorly",
          desc: "Платформа для онлайн-обучения с видеоуроками и оплатой.",
          tag: "SaaS",
        },
      ];

      const steps = [
        "Созвон и разбор идеи",
        "Прототип и план работ",
        "Дизайн и разработка",
        "Тестирование и запуск",
      ];

      function App() {
        return (
          <div>
            <header className="container">
              <div className="logo">APP.STUDIO</div>
              <nav>
                <a href="#services">Услуги</a>
                <a href="#portfolio">Проекты</a>
                <a href="#process">Процесс</a>
                <a href="#contact">Контакты</a>
              </nav>
            </header>

            <main className="container">
              <section className="hero">
                <div>
                  <span className="badge">🚀 Продаю разработку приложений</span>
                  <h1>Создаю мобильные и веб-приложения, которые приносят продажи</h1>
                  <p>
                    Я помогаю компаниям запускать цифровые продукты: от MVP до
                    масштабирования. Работаю на React, React Native и Node.js.
                  </p>
                  <div className="cta-row">
                    <a className="button primary" href="#contact">
                      Обсудить проект
                    </a>
                    <a className="button ghost" href="#portfolio">
                      Смотреть кейсы
                    </a>
                  </div>
                  <div className="stats">
                    <div className="stat">
                      <strong>20+</strong>
                      <div>релизов</div>
                    </div>
                    <div className="stat">
                      <strong>5 лет</strong>
                      <div>опыт в разработке</div>
                    </div>
                    <div className="stat">
                      <strong>14 дней</strong>
                      <div>первый демо-результат</div>
                    </div>
                  </div>
                </div>
                <div className="card">
                  <h3>Что получите</h3>
                  <ul>
                    <li>Четкий план и прозрачные сроки.</li>
                    <li>Современный UI/UX и понятная аналитика.</li>
                    <li>Техническое сопровождение после релиза.</li>
                    <li>Готовность быстро масштабироваться.</li>
                  </ul>
                </div>
              </section>

              <section id="services">
                <div className="section-title">Услуги</div>
                <div className="grid services">
                  {services.map((service) => (
                    <div className="card" key={service.title}>
                      <h3>{service.title}</h3>
                      <p>{service.desc}</p>
                    </div>
                  ))}
                </div>
              </section>

              <section id="portfolio">
                <div className="section-title">Проекты</div>
                <div className="grid portfolio">
                  {projects.map((project) => (
                    <div className="card project" key={project.name}>
                      <span className="tag">{project.tag}</span>
                      <h3>{project.name}</h3>
                      <p>{project.desc}</p>
                      <span>Результат: рост заявок +32%</span>
                    </div>
                  ))}
                </div>
              </section>

              <section id="process">
                <div className="section-title">Процесс работы</div>
                <div className="grid services">
                  {steps.map((step, index) => (
                    <div className="card" key={step}>
                      <h3>0{index + 1}</h3>
                      <p>{step}</p>
                    </div>
                  ))}
                </div>
              </section>

              <section id="contact">
                <div className="contact">
                  <div>
                    <h2>Готовы запустить ваше приложение?</h2>
                    <p>
                      Напишите мне, я подготовлю план и стоимость уже в течение 48
                      часов.
                    </p>
                  </div>
                  <div className="cta-row">
                    <a className="button primary" href="mailto:hello@appstudio.dev">
                      hello@appstudio.dev
                    </a>
                    <a className="button ghost" href="tel:+77001234567">
                      +7 (700) 123-45-67
                    </a>
                  </div>
                </div>
              </section>
            </main>

            <footer className="container">
              © 2024 APP.STUDIO. Сделано на React для учебного теста.
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
